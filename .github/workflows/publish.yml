name: Publish

# Publishes to PyPI when a merge to main changes the version in
# src/cloro/_version.py, then creates the vX.Y.Z tag and GitHub Release.
# A Release published by hand also publishes, as before.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# The trusted publisher is configured at:
#   https://pypi.org/manage/project/cloro/settings/publishing/

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cloro/_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check
    if: always() && (github.event_name != 'push' || needs.check.outputs.new == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: write   # required to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.check.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ needs.check.outputs.version }}" --generate-notes
