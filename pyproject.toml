[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloro"
dynamic = ["version"]
description = "Official Python SDK for the cloro API — one API for Google Search and every AI answer engine (ChatGPT, Gemini, Perplexity, Copilot, Grok, AI Overview, AI Mode)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cloro", email = "support@cloro.dev" }]
keywords = [
    "cloro",
    "serp",
    "serp api",
    "ai search",
    "chatgpt",
    "perplexity",
    "gemini",
    "copilot",
    "google search",
    "web scraping",
    "seo",
    "geo",
    "ai visibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://cloro.dev"
Documentation = "https://cloro.dev/docs"
Source = "https://github.com/cloro-dev/cloro-python"
Issues = "https://github.com/cloro-dev/cloro-python/issues"

[tool.hatch.version]
path = "src/cloro/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cloro"]

[tool.hatch.build.targets.sdist]
include = ["src/cloro", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
